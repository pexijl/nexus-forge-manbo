plugins {
    id 'java'
}

group = 'com.nexusforge'
version = '0.0.1-SNAPSHOT'
description = '启动模块'

repositories {
    mavenCentral()
}

bootJar {
    enabled = true
}

dependencies {
    implementation project(':nexus-forge-core')
    implementation project(':nexus-forge-common')
    implementation project(':nexus-forge-user')
    implementation project(':nexus-forge-auth')
    implementation project(':nexus-forge-file')
    implementation project(':nexus-forge-ai')
    implementation("org.springdoc:springdoc-openapi-starter-webmvc-ui")
    implementation 'org.springframework.boot:spring-boot-starter-webmvc'
    implementation 'org.springframework.boot:spring-boot-starter-actuator'

    // 测试依赖
    testImplementation 'org.springframework.boot:spring-boot-starter-test'
    testImplementation 'org.springframework.boot:spring-boot-restclient'
    testImplementation 'org.springframework.security:spring-security-test'
    testImplementation platform('org.junit:junit-bom:6.0.0')
    testImplementation 'org.junit.jupiter:junit-jupiter'

    // Testcontainers
    testImplementation platform('org.testcontainers:testcontainers-bom:1.20.4')
    testImplementation 'org.testcontainers:postgresql'

    // S3 SDK —— 集成测试启动时建 bucket(生产代码 nexus-forge-file 已带,test 只引一份)
    testImplementation platform('software.amazon.awssdk:bom:2.46.16')
    testImplementation 'software.amazon.awssdk:s3'
}

// 集成测试默认隔离,-Pintegration 开启才执行
tasks.named('test') {
    useJUnitPlatform {
        if (!project.hasProperty('integration')) {
            excludeTags 'integration'
        }
    }
}

// P7 修复:把 bootRun 工作目录固定到仓库根,让 `optional:file:.env[.properties]`
// 能从仓库根读到 .env(而不是从 nexus-forge-web/ 子目录找)。否则 JWT_SECRET 等
// 环境变量会被解析为空,导致 JwtUtil.init 抛 WeakKeyException。
bootRun {
    workingDir = rootProject.projectDir
}