# 通用配置文件

spring:
  application:
    name: nexus-forge
  jackson:
    timezone: UTC # 设置时区为UTC，避免时区问题导致的时间显示错误
  profiles:
    active: dev  # 默认激活 dev 环境
  mvc:
    problemdetails:
      enabled: true # Problem Details for HTTP APIs 规范的错误响应格式
  servlet:
    multipart:
      enabled: true
      max-file-size: 5MB          # 单文件上限（头像 5MB 够用）
      max-request-size: 10MB      # 整个请求上限
      file-size-threshold: 2MB    # 超过此值写入磁盘，否则内存
storage:
  vendor: minio # 存储服务提供商，支持 minio、aliyun、tencent、qiniu、local

  minio:
    default:
      endpoint: http://localhost:9000
      region: us-east-1
      access-key: minioadmin
      secret-key: minioadmin
      bucket: nexus-forge
      path-style: true

  aliyun:
    default:
      endpoint: https://oss-cn-beijing.aliyuncs.com
      region: cn-beijing
      access-key: ${ALIYUN_AK}          # ★ 从环境变量读
      secret-key: ${ALIYUN_SK}
      bucket: my-app-prod
      path-style: false
      cdn-domain: https://cdn.example.com  # ★ CDN 加速域名

  tencent:
    default:
      endpoint: https://cos.ap-beijing.myqcloud.com
      region: ap-beijing
      secret-id: ${TENCENT_SECRET_ID}
      secret-key: ${TENCENT_SECRET_KEY}
      bucket: my-app-prod-1250000000    # ★ 腾讯云 bucket 名带 APPID 后缀
      path-style: false