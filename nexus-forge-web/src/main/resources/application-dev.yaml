# 开发配置文件

spring:
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/nexus-forge?serverTimezone=UTC} # 数据库连接URL，指定时区为UTC
    username: ${DB_USERNAME:postgres} # 数据库用户名
    password: ${DB_PASSWORD} # 数据库密码（dev 无默认，强制从环境变量注入）
    driver-class-name: org.postgresql.Driver # 数据库驱动类名
    hikari:
      maximum-pool-size: 20 # Hikari连接池的最大连接数
      minimum-idle: 5 # Hikari连接池的最小空闲连接数
      connection-timeout: 30000 # Hikari连接池的连接超时时间（毫秒）
  flyway:
    # 迁移脚本位置:nexus-forge-user/src/main/resources/db/migration
    locations: classpath:db/migration
    # 已有库的非空 schema,baseline-on-migrate=true 让 Flyway 在 schema 非空时自动打 baseline,
    # 然后从 baseline-version 之后继续应用迁移(不会因为"找不到 baseline"报错)
    baseline-on-migrate: true
    # 自动调用 validate 校验已应用迁移的 checksum
    validate-on-migrate: true
    enabled: true
  jpa:
    hibernate:
      # ddl-auto=none:Flyway 是建表的唯一权威源,不让 Hibernate 去校验/建表。
      # 之前用的 validate 在 Spring Boot 4.1 + Flyway 手写集成的场景下,
      # 会在某些版本里早于 Flyway 跑,导致"实体期待的字段在表里不存在"假阳性报错。
      ddl-auto: none
    properties:
      hibernate:
        format_sql: false # 格式化SQL语句，方便阅读
    show-sql: true # 显示SQL语句，方便调试
    open-in-view: false # 关闭Open Session in View，避免性能问题和潜在的内存泄漏
  ai:
    # spring.ai.openai.api-key 直写在基线 application.yaml(所有 profile 共享占位符)
    # dev 不重复;providers.openai.enabled: false 让 ProviderPropertiesBridge 跳过 openai,
    # 所以基线直写不会被 openai 段覆盖;但 providers.deepseek.enabled: true 会让 bridge
    # 从 deepseek 段写出 spring.ai.openai.api-key = ${DEEPSEEK_API_KEY:placeholder...}
    # (addFirst 赢),实际 dev 跑的是 deepseek 的 key(预期:国内网络走 deepseek)。
    enabled: ${SPRING_AI_ENABLED:true}
    default-vendor: ${SPRING_AI_DEFAULT_VENDOR:}
    # 注意:default-model(根级)默认不配;管理员通过 PUT /api/admin/ai/global-default
    # 写入 ai_global_default 表后,系统模式调用才会用上 model。
    # 启动校验:每个 enabled=true 的 vendor 必须有 yaml-level default-model(否则
    # 容器构造失败 fail-fast);但运行时 system 模式请求一律从 ai_global_default 表读,
    # 不会被 yaml 兜底值覆盖。
    # 双 namespace 优先级规则(更正):
    #   providers.<v>.enabled=true  → bridge 桥 providers.<v>.* 到 spring.ai.<starter>.*,
    #                                此时不要直写 spring.ai.<starter>.* (bridge addFirst
    #                                会赢,直写被静默覆盖)
    #   providers.<v>.enabled=false → bridge 跳过,此时可以直写 spring.ai.<starter>.*
    #                                喂 starter 装配 bean(典型场景:dev 关闭 openai vendor
    #                                路由但 deepseek 复用 openai starter,直写 deepseek key)
    # Phase 5 起非 OpenAI 协议的 vendor 仍走 providers.* 统一 schema。
    providers:
      # 关闭 OpenAI vendor 路由(国内网络不通),实际请求走 deepseek
      openai:
        enabled: false
      # DeepSeek 启用(国内可直连;DeepSeek 之前是独立 spring-ai-starter-model-deepseek,
      # phase X 已移除 — 改走 OpenAI starter,bridge 把 providers.deepseek.* 桥到
      # spring.ai.openai.*,ChatModelRouter 通过 aliasing 把 "deepseek" vendor 路由
      # 到 openAiChatModel bean)
      deepseek:
        enabled: true
      # Ollama 启用(本地推理,需要本地 ollama 进程;没装就保留 base 的 enabled: true 但
      # bridge 桥完 starter 还是连不到,启动会自然报错暴露)
      ollama:
        enabled: true
      # 国内 vendor(dashscope / glm / minimax)默认关,按需在 dev override
      # 启用(改了 enabled: true + 配对应 *_API_KEY env var 即可,bridge 自动桥)
    # P5 — Token 用量配额(24h 滑窗,长期防刷)
    quota:
      enabled: ${SPRING_AI_QUOTA_ENABLED:true}
      default-user-tier: USER
      tiers:
        USER:
          # dev 默认配额:1M token/天 + 5000 次/天;prod 通过 .env 覆盖
          daily-token-limit: 1000000
          request-limit: 5000
        ADMIN:
          # dev:管理员不限,生产可改
          daily-token-limit: null
          request-limit: null
    # P5 — 限流(Caffeine 本地令牌桶,秒级防突发)
    rate-limit:
      enabled: ${SPRING_AI_RATE_LIMIT_ENABLED:true}
      user-qps: 1.0
      user-burst: 5
      ip-qps: 5.0
      ip-burst: 20


jwt:
  secret: ${JWT_SECRET:} # JWT的签名密钥（dev 无默认，强制从环境变量注入）
  access-ttl: ${JWT_ACCESS_TTL_MS:900000} # JWT访问令牌的有效期，单位为毫秒（默认15分钟）
  refresh-ttl: ${JWT_REFRESH_TTL_MS:604800000} # JWT刷新令牌的有效期，单位为毫秒（默认7天）
  header: Authorization # 请求头中存放JWT的字段名称
  prefix: Bearer # JWT的前缀，通常是Bearer，表示使用Bearer Token认证
  enable-blacklist: true # 是否启用JWT黑名单功能，防止已注销的令牌被继续使用
  blacklist-prefix: 'auth:blacklist:' # JWT黑名单在Redis中的前缀，方便区分其他数据
  refresh-prefix: 'auth:refresh:' # JWT刷新令牌在Redis中的前缀，方便区分其他数据

storage:
  vendor: ${STORAGE_VENDOR:rustfs}

# 邮件发送:dev 默认 logging 模式(落 build/dev-mail/ + log INFO)。
# PasswordResetProperties 在 password-reset.* 段;默认值见 PasswordResetProperties 字段。
mail:
  mode: ${MAIL_MODE:logging}
  from: ${MAIL_FROM:Nexus Forge <no-reply@nexus-forge.local>}
password-reset:
  code-ttl-seconds: ${PWD_RESET_CODE_TTL:300}
  max-attempts: ${PWD_RESET_MAX_ATTEMPTS:5}
  rate-limit-window-seconds: ${PWD_RESET_RATE_WINDOW:60}
  rate-limit-email-max: ${PWD_RESET_RATE_EMAIL:1}
  rate-limit-ip-max: ${PWD_RESET_RATE_IP:3}

