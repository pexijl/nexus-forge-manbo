# 生产配置文件

spring:
  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
  flyway:
    locations: classpath:db/migration
    baseline-on-migrate: true
    validate-on-migrate: true
    enabled: true
  jpa:
    show-sql: false
    hibernate:
      ddl-auto: validate # 生产环境使用validate，确保数据库结构正确但不自动修改
  mail:
    # prod 显式走 SMTP;host/port/user/pass 全部从环境变量注入
    host: ${SMTP_HOST}
    port: ${SMTP_PORT:587}
    username: ${SMTP_USER}
    password: ${SMTP_PASS}
    properties:
      mail.smtp.auth: ${SMTP_AUTH:true}
      mail.smtp.starttls.enable: ${SMTP_STARTTLS:true}


jwt:
  secret: ${JWT_SECRET} # JWT的签名密钥，应该保存在安全的地方
  ttl: ${JWT_TTL_MS} # 2小时，单位为毫秒
  header: Authorization # 请求头中存放JWT的字段名称
  prefix: Bearer # JWT的前缀，通常是Bearer，表示使用Bearer Token认证

storage:
  vendor: ${STORAGE_VENDOR}

  # prod 严禁使用 minio 默认凭据;显式声明要求从环境变量注入
  minio:
    default:
      access-key: ${MINIO_ACCESS_KEY}
      secret-key: ${MINIO_SECRET_KEY}

# 邮件发送:prod 走 SMTP(SmtpEmailSender);logging 模式不会在 prod 启用
mail:
  mode: ${MAIL_MODE:smtp}
  from: ${MAIL_FROM:Nexus Forge <no-reply@nexus-forge.local>}
password-reset:
  code-ttl-seconds: ${PWD_RESET_CODE_TTL:300}
  max-attempts: ${PWD_RESET_MAX_ATTEMPTS:5}
  rate-limit-window-seconds: ${PWD_RESET_RATE_WINDOW:60}
  rate-limit-email-max: ${PWD_RESET_RATE_EMAIL:1}
  rate-limit-ip-max: ${PWD_RESET_RATE_IP:3}
