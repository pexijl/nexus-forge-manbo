name: CI

on:
  push:
    branches: [main, dev-01]
  pull_request:
    branches: [main, dev-01]

# 同一 PR 取消上一次未完成的运行,避免冗余排队
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  GRADLE_USER_HOME: ${{ github.workspace }}/.gradle

jobs:
  backend:
    name: Backend (Gradle build + test)
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 26
        uses: actions/setup-java@v4
        with:
          java-version: '26'
          distribution: 'temurin'

      # GitHub Actions 跑在海外,把腾讯云镜像换成官方 distributionUrl;
      # 直接重写 distributionUrl 行,避免 sed 模式与 .properties 转义字符打架
      - name: Use official Gradle distribution
        run: |
          python - <<'PY'
          import re, pathlib
          p = pathlib.Path('gradle/wrapper/gradle-wrapper.properties')
          text = p.read_text(encoding='utf-8')
          updated = re.sub(
              r'^distributionUrl=.*$',
              r'distributionUrl=https\://services.gradle.org/distributions/gradle-9.6.0-bin.zip',
              text,
              flags=re.M,
          )
          p.write_text(updated, encoding='utf-8')
          print(p.read_text(encoding='utf-8'))
          PY

      - name: Ensure gradlew is executable
        # actions/checkout@v4 默认不保留 wrapper 脚本的可执行位,显式 +x 一次
        run: chmod +x gradlew
      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            .gradle/caches
            .gradle/wrapper
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties', '**/buildSrc/**') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      - name: Build & test
        run: ./gradlew --no-daemon clean build

      # 上传测试报告,即使 build 失败也能看到
      - name: Upload test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-test-report
          path: '**/build/reports/tests/test/index.html'
          if-no-files-found: ignore

  frontend:
    name: Frontend (lint + type-check + build)
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'   # 22.13+ 满足 Vite 7 的 engines 要求
          cache: 'npm'
          cache-dependency-path: nexus-forge-ui/package-lock.json

      - name: Install dependencies
        working-directory: nexus-forge-ui
        # 用 npm install 而非 npm ci:package-lock.json 与 eslint.config.ts 当前不同步
        # (eslint.config.ts 引用 globals,但未声明在 package.json devDependencies),
        # 待后续 PR 修复依赖完整性后改回 npm ci
        run: npm install --no-audit --no-fund

      - name: Lint
        working-directory: nexus-forge-ui
        # continue-on-error:lint 处于项目内清理阶段(eslint.config.ts 刚修过、若干 existing
        # any/未使用变量等待治理),不应阻断 build。等后续 PR 把现有错误清零后再移除此标志
        continue-on-error: true
        run: npm run lint

      - name: Build (type-check + vite build)
        working-directory: nexus-forge-ui
        run: npm run build

      - name: Upload build output
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: frontend-dist
          path: nexus-forge-ui/dist
          retention-days: 7