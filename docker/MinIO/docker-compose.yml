version: '3.8'
services:
  minio-server:
    image: minio/minio:latest
    container_name: minio
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - "9000:9000"
      - "9001:9001"
    command: server /data --console-address ":9001"
    volumes:
      - minio_data:/data
      - minio_config:/root/.minio
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 5s

volumes:
  minio_data:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: G:\\Volumes\\docker\\minio\\data
  minio_config:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: G:\\Volumes\\docker\\minio\\config