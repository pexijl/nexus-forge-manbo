plugins {
    id 'java-library'
    id 'org.springframework.boot'
    id 'io.spring.dependency-management'
}

group = 'com.nexusforge'
version = '0.0.1-SNAPSHOT'
description = 'AI 模块'

// 不让本模块生成可执行的 bootJar,只做 library
bootJar { enabled = false }

// springdoc 与根 dependencyManagement 一致:3.0.3(根 build.gradle 已声明)
// starter-web MVC,SSE/WebClient 用 spring-webflux 库(不带 WebFluxAutoConfiguration);
// 共存于 MVC 容器不会冲突,Flux 已是 P1 ChatModel.stream 的返回类型,P2 把它用起来。
dependencies {
    api project(':nexus-forge-common')                  // 域模型、Result、UserPrincipal
    implementation project(':nexus-forge-core')         // P5 Step 7: RateLimiter + RateLimitException
    implementation 'org.springframework.boot:spring-boot-starter-web'      // MVC
    implementation 'org.springframework.boot:spring-boot-starter-validation'
    // @AuthenticationPrincipal 来自 spring-security-core;AI 模块的 controller 解析
    // 通过 JwtAuthenticationFilter 写入 SecurityContextHolder 的 UserPrincipal。
    implementation 'org.springframework.security:spring-security-core'
    implementation 'org.springdoc:springdoc-openapi-starter-webmvc-ui'
    implementation 'io.projectreactor:reactor-core'
    // P2 流式:WebClient API + Reactor Netty 客户端传输。spring-web 的
    // ReactorClientHttpConnector 构造器签名是 (reactor.netty.http.client.HttpClient),
    // 该类位于 reactor-netty-http(不是 reactor-netty-core)。两 jar 必须同版本,
    // 由根 build.gradle dependencyManagement 的 reactorNettyVersion = '1.2.6' 统一管理。
    implementation 'org.springframework:spring-webflux'
    implementation 'io.projectreactor.netty:reactor-netty-core'
    implementation 'io.projectreactor.netty:reactor-netty-http'
    // P5 Step 4: UsageRecorder 上报 Micrometer 指标,ai.chat.requests / tokens.* 四个 counter
    // 由 ConversationService 在 P3 已落的 usageRepo.save 之后调用 recordMetrics 触发。
    // nexus-forge-ai 是 library,不依赖 actuator;但需要 io.micrometer:micrometer-core 中的
    // MeterRegistry 接口(observation/commons 不含)。
    implementation 'io.micrometer:micrometer-core'
    // Phase 1 — model catalog 缓存:ModelCatalogService 用 Caffeine 做 5min TTL +
    // 事件失效。nexus-forge-core 也用 Caffeine 但只声明为 implementation
    // (不向上传递),所以 ai 模块要直接声明。版本与根 build.gradle dependencyManagement
    // 锁定一致(caffeine 3.2.4)。
    implementation 'com.github.ben-manes.caffeine:caffeine:3.2.4'
    // spring-ai-full-migration Phase 1 + 后续精简:引入 3 个 Spring AI 官方厂商 starter
    // (qwen / DashScope 不在 Spring AI 官方生态,由 Spring AI Alibaba 社区维护,
    //  暂不接入)。版本由根 build.gradle 的 spring-ai-bom 统一锁定,不显式写 version。
    // - openai:覆盖 OpenAI 托管,以及 DeepSeek / Ollama / 中转站 / 国内 OpenAI 兼容厂商。
    //   DeepSeek 原本走 spring-ai-starter-model-deepseek(phase X 移除)— DeepSeek API
    //   是 OpenAI Chat Completions 协议家族,复用 OpenAI starter 更轻量;yaml 的
    //   providers.deepseek.* 配置由 ProviderPropertiesBridge 桥到 spring.ai.openai.*,
    //   ChatModelRouter 通过 aliasing 把 "deepseek" vendor 路由到 openAiChatModel bean。
    //   私 Key 模式仍由 VendorChatModelFactory 动态构造 OpenAiChatModel 走 DeepSeek
    //   base-url/api-key,跟系统 Key 路径一致。
    // - anthropic:Anthropic Claude 全家桶(2.0 已切官方 anthropic-sdk-java,非 OpenAI 兼容)
    // - ollama:本地推理,默认 base-url http://localhost:11434
    implementation 'org.springframework.ai:spring-ai-starter-model-openai'
    implementation 'org.springframework.ai:spring-ai-starter-model-anthropic'
    implementation 'org.springframework.ai:spring-ai-starter-model-ollama'
    testImplementation 'org.junit.jupiter:junit-jupiter'
    testImplementation 'org.junit.jupiter:junit-jupiter-params'
    testImplementation 'com.squareup.okhttp3:mockwebserver3-junit5:5.4.0'
    // P4 Step 9: stream 降级集成测试用 StepVerifier 断言 Flux 输出
    testImplementation 'io.projectreactor:reactor-test'
    testImplementation 'org.assertj:assertj-core'
    // P5 Step 1: @DataJpaTest + Testcontainers 跑真实 SQL 测聚合 JPQL。
    // - starter-test 由根 build.gradle 子项目级统一引入,这里不重复;
    // - testcontainers-bom 走 platform(...) 模式,与 nexus-forge-web 保持一致。
    testImplementation platform('org.testcontainers:testcontainers-bom:1.20.4')
    testImplementation 'org.testcontainers:junit-jupiter'
    testImplementation 'org.testcontainers:postgresql'
    // P5 Step 2: 显式跑 JSR-303 校验(boot 4.1 ApplicationContextRunner
    // 不装配 MethodValidationPostProcessor,直接用 jakarta.validation API)
    testImplementation 'org.springframework.boot:spring-boot-starter-validation'
}

test { useJUnitPlatform() }
