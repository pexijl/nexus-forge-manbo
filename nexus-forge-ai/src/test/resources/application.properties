# nexus-forge-ai 模块的测试全局配置。
#
# spring-ai-full-migration Phase 1:spring-ai-starter-model-openai / -anthropic /
# -deepseek / -ollama 4 个 starter 引入 classpath 后,Spring Boot 4.1 的 4 个
# ChatModelAutoConfiguration 在 spring.ai.<vendor>.api-key 为空时直接抛
# IllegalArgumentException,被 nexus-forge-ai 模块的 @SpringBootTest 用例
# (如 AiMessageUsageRepositoryTest) 拉起 Spring 上下文时拦截,导致用例 fail。
#
# 这些用例与 Spring AI 无关,只验 JPA 聚合;给个 dummy 值让 Spring AI 的
# 4 个 bean 都能成功构造。nexus-forge-ai/src/test 下的单元测试
# (不加载 Spring 上下文) 不受此配置影响。
#
# dev / prod 配置由 application-dev.yaml / application-prod.yaml 走真实 key。
spring.ai.openai.api-key=test-dummy-key
spring.ai.anthropic.api-key=test-dummy-key
spring.ai.deepseek.api-key=test-dummy-key
spring.ai.ollama.base-url=http://localhost:11434
spring.ai.ollama.chat.options.model=llama3.1
